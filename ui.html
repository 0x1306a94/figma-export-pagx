<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font: 12px/1.4 Inter, sans-serif;
      margin: 0;
      padding: 16px;
      color: #111;
    }
    h2 { margin: 0 0 8px; font-size: 14px; }
    .lead { margin: 0 0 16px; color: #666; }
    .section { margin-bottom: 16px; }
    .section-label {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #888;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    #export {
      background: #18a0fb;
      color: #fff;
      margin-bottom: 8px;
    }
    #export:disabled { opacity: 0.6; cursor: default; }
    #export-pag {
      background: #111;
      color: #fff;
      margin-bottom: 0;
    }
    #export-pag:disabled { opacity: 0.6; cursor: default; }
    #refresh-motion-anchor {
      background: #0d9488;
      color: #fff;
      margin-bottom: 0;
    }
    #refresh-motion-anchor:disabled { opacity: 0.6; cursor: default; }
    #motion-warning {
      margin: 0 0 8px;
      padding: 8px;
      background: #fff7e6;
      color: #8a6100;
      border: 1px solid #f3c96b;
      border-radius: 6px;
      font-size: 11px;
    }
    #meta {
      margin: 12px 0 0;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 6px;
      display: none;
    }
    #diagnostics {
      margin-top: 12px;
      max-height: 180px;
      overflow: auto;
    }
    .diag {
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .diag.warning { background: #fff7e6; color: #8a6100; }
    .diag.error { background: #ffecec; color: #a12828; }
    .diag.info { background: #eef6ff; color: #245ea8; }
    #error {
      display: none;
      margin-top: 12px;
      padding: 8px;
      background: #ffecec;
      color: #a12828;
      border-radius: 6px;
    }
    #refresh-status {
      display: none;
      margin: 8px 0 0;
      padding: 8px;
      background: #ecfdf5;
      color: #047857;
      border-radius: 6px;
      font-size: 11px;
    }
    #motion-panel {
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-row span {
      font-size: 12px;
      color: #333;
    }
    .toggle-row input {
      margin: 0;
    }
    #motion-body {
      display: none;
      margin-top: 8px;
    }
    #motion-body.visible {
      display: block;
    }
    #motion-hint {
      margin: 0;
      color: #666;
      font-size: 11px;
    }
    #motion-json {
      margin: 6px 0 0;
      padding: 8px;
      max-height: 220px;
      overflow: auto;
      background: #f5f5f5;
      border-radius: 6px;
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h2>导出 PAGX / PAG</h2>
  <p class="lead">选择一个 Frame 或图层作为 root，导出为 .pagx 或 .pag。</p>

  <div class="section">
    <div class="section-label">准备</div>
    <div id="motion-warning">
      如果存在手动调整过锚点的节点，请先将 Figma Motion 时间线拖到该节点动画起始点稍后，选中该节点并点击刷新锚点缓存。全部刷新后，再回到起始位置选中 Frame 导出。
    </div>
    <button id="refresh-motion-anchor">刷新锚点缓存</button>
    <div id="refresh-status"></div>
  </div>

  <div class="section">
    <div class="section-label">导出</div>
    <button id="export">导出 PAGX</button>
    <button id="export-pag">导出 PAG</button>
    <div id="meta"></div>
    <div id="error"></div>
    <div id="diagnostics"></div>
  </div>

  <div id="motion-panel" class="section">
    <div class="section-label">开发者</div>
    <label class="toggle-row">
      <span>显示动画数据</span>
      <input type="checkbox" id="motion-toggle" />
    </label>
    <div id="motion-body">
      <p id="motion-hint">选中一个节点后显示 JSON</p>
      <pre id="motion-json"></pre>
    </div>
  </div>

  <script>
    const exportButton = document.getElementById('export');
    const exportPagButton = document.getElementById('export-pag');
    const refreshMotionAnchorButton = document.getElementById('refresh-motion-anchor');
    const metaEl = document.getElementById('meta');
    const errorEl = document.getElementById('error');
    const refreshStatusEl = document.getElementById('refresh-status');
    const diagnosticsEl = document.getElementById('diagnostics');
    const motionToggleEl = document.getElementById('motion-toggle');
    const motionBodyEl = document.getElementById('motion-body');
    const motionHintEl = document.getElementById('motion-hint');
    const motionJsonEl = document.getElementById('motion-json');

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function showError(message) {
      errorEl.style.display = 'block';
      errorEl.textContent = message;
    }

    function clearError() {
      errorEl.style.display = 'none';
      errorEl.textContent = '';
    }

    function showRefreshStatus(message) {
      refreshStatusEl.style.display = 'block';
      refreshStatusEl.textContent = message;
    }

    function setExportBusy(busy) {
      exportButton.disabled = busy;
      exportPagButton.disabled = busy;
      exportButton.textContent = busy ? '导出中...' : '导出 PAGX';
      exportPagButton.textContent = busy ? '导出中...' : '导出 PAG';
    }

    function setRefreshBusy(busy) {
      refreshMotionAnchorButton.disabled = busy;
      refreshMotionAnchorButton.textContent = busy ? '刷新中...' : '刷新锚点缓存';
    }

    function renderDiagnostics(items) {
      diagnosticsEl.innerHTML = '';
      if (!items || items.length === 0) {
        return;
      }
      for (const item of items) {
        const div = document.createElement('div');
        div.className = `diag ${item.level}`;
        div.textContent = `[${item.code}] ${item.message}`;
        diagnosticsEl.appendChild(div);
      }
    }

    function renderMotionData(msg) {
      if (!msg.data) {
        motionHintEl.textContent = msg.hint || '未选中节点';
        motionJsonEl.textContent = '';
        return;
      }

      motionHintEl.textContent = `${msg.nodeName}（${msg.data.length} 个节点）`;
      motionJsonEl.textContent = JSON.stringify(msg.data, null, 2);
    }

    function downloadPagx(xml, fileName) {
      const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(url);
    }

    function downloadPag(bytes, fileName) {
      const blob = new Blob([new Uint8Array(bytes)], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(url);
    }

    motionToggleEl.onchange = () => {
      motionBodyEl.classList.toggle('visible', motionToggleEl.checked);
    };

    exportButton.onclick = () => {
      clearError();
      setExportBusy(true);
      parent.postMessage({ pluginMessage: { type: 'export-pagx' } }, '*');
    };

    exportPagButton.onclick = () => {
      clearError();
      setExportBusy(true);
      parent.postMessage({ pluginMessage: { type: 'export-pag' } }, '*');
    };

    refreshMotionAnchorButton.onclick = () => {
      clearError();
      setRefreshBusy(true);
      parent.postMessage({ pluginMessage: { type: 'refresh-motion-anchor' } }, '*');
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'export-error') {
        setExportBusy(false);
        showError(msg.error);
        return;
      }

      if (msg.type === 'export-result') {
        setExportBusy(false);
        clearError();
        const size = new Blob([msg.xml]).size;
        metaEl.style.display = 'block';
        metaEl.textContent = `画布 ${msg.width} × ${msg.height}，节点 ${msg.nodeCount} 个，.pagx ${formatBytes(size)}`;
        renderDiagnostics(msg.diagnostics);
        downloadPagx(msg.xml, msg.fileName);
        return;
      }

      if (msg.type === 'export-pag-result') {
        setExportBusy(false);
        clearError();
        metaEl.style.display = 'block';
        metaEl.textContent = `画布 ${msg.width} × ${msg.height}，节点 ${msg.nodeCount} 个，.pag ${formatBytes(msg.bytes.length)}`;
        renderDiagnostics(msg.diagnostics);
        downloadPag(msg.bytes, msg.fileName);
        return;
      }

      if (msg.type === 'selection-motion-data') {
        renderMotionData(msg);
        return;
      }

      if (msg.type === 'refresh-motion-anchor-result') {
        setRefreshBusy(false);
        showRefreshStatus(msg.message);
      }
    };
  </script>
</body>
</html>
