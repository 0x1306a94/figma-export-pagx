<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font: 12px/1.4 Inter, sans-serif;
      margin: 0;
      padding: 16px;
      color: #111;
    }
    h2 { margin: 0 0 8px; font-size: 14px; }
    p { margin: 0 0 12px; color: #666; }
    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    #export {
      background: #18a0fb;
      color: #fff;
      margin-bottom: 8px;
    }
    #export:disabled { opacity: 0.6; cursor: default; }
    #refresh-motion-anchor {
      background: #0d9488;
      color: #fff;
      margin-bottom: 8px;
    }
    #refresh-motion-anchor:disabled { opacity: 0.6; cursor: default; }
    #cancel {
      background: #f0f0f0;
      color: #333;
    }
    #motion-warning {
      margin: 0 0 12px;
      padding: 8px;
      background: #fff7e6;
      color: #8a6100;
      border: 1px solid #f3c96b;
      border-radius: 6px;
      font-size: 11px;
    }
    #meta {
      margin: 12px 0;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 6px;
      display: none;
    }
    #diagnostics {
      margin-top: 12px;
      max-height: 180px;
      overflow: auto;
    }
    .diag {
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .diag.warning { background: #fff7e6; color: #8a6100; }
    .diag.error { background: #ffecec; color: #a12828; }
    .diag.info { background: #eef6ff; color: #245ea8; }
    #error {
      display: none;
      margin-top: 12px;
      padding: 8px;
      background: #ffecec;
      color: #a12828;
      border-radius: 6px;
    }
    #refresh-status {
      display: none;
      margin: 0 0 12px;
      padding: 8px;
      background: #ecfdf5;
      color: #047857;
      border-radius: 6px;
      font-size: 11px;
    }
    #motion-panel {
      margin-top: 12px;
    }
    #motion-panel h3 {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 600;
    }
    #motion-hint {
      margin: 0;
      color: #666;
      font-size: 11px;
    }
    #motion-json {
      margin: 6px 0 0;
      padding: 8px;
      max-height: 220px;
      overflow: auto;
      background: #f5f5f5;
      border-radius: 6px;
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h2>导出 PAGX</h2>
  <p>选择一个 Frame 或图层作为 root，然后导出为 .pagx 文件。</p>
  <div id="motion-warning">
    如果存在手动调整过锚点的节点，请先将 Figma Motion 时间线拖到该节点动画起始点稍后，选中该节点并点击刷新锚点缓存。全部刷新后，再回到起始位置选中 Frame 导出。
  </div>
  <button id="refresh-motion-anchor">刷新锚点缓存</button>
  <div id="refresh-status"></div>
  <button id="export">导出 PAGX</button>
  <button id="cancel">关闭</button>
  <div id="meta"></div>
  <div id="error"></div>
  <div id="diagnostics"></div>
  <div id="motion-panel">
    <h3>动画数据</h3>
    <p id="motion-hint">选中一个节点后显示 JSON</p>
    <pre id="motion-json"></pre>
  </div>
  <script>
    const exportButton = document.getElementById('export');
    const refreshMotionAnchorButton = document.getElementById('refresh-motion-anchor');
    const cancelButton = document.getElementById('cancel');
    const metaEl = document.getElementById('meta');
    const errorEl = document.getElementById('error');
    const refreshStatusEl = document.getElementById('refresh-status');
    const diagnosticsEl = document.getElementById('diagnostics');
    const motionHintEl = document.getElementById('motion-hint');
    const motionJsonEl = document.getElementById('motion-json');

    function showError(message) {
      errorEl.style.display = 'block';
      errorEl.textContent = message;
    }

    function clearError() {
      errorEl.style.display = 'none';
      errorEl.textContent = '';
    }

    function showRefreshStatus(message) {
      refreshStatusEl.style.display = 'block';
      refreshStatusEl.textContent = message;
    }

    function renderDiagnostics(items) {
      diagnosticsEl.innerHTML = '';
      if (!items || items.length === 0) {
        return;
      }
      for (const item of items) {
        const div = document.createElement('div');
        div.className = `diag ${item.level}`;
        div.textContent = `[${item.code}] ${item.message}`;
        diagnosticsEl.appendChild(div);
      }
    }

    function renderMotionData(msg) {
      if (!msg.data) {
        motionHintEl.textContent = msg.hint || '未选中节点';
        motionJsonEl.textContent = '';
        return;
      }

      motionHintEl.textContent = `${msg.nodeName}（${msg.data.length} 个节点）`;
      motionJsonEl.textContent = JSON.stringify(msg.data, null, 2);
    }

    function downloadPagx(xml, fileName) {
      const blob = new Blob([xml], { type: 'application/xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(url);
    }

    exportButton.onclick = () => {
      clearError();
      exportButton.disabled = true;
      exportButton.textContent = '导出中...';
      parent.postMessage({ pluginMessage: { type: 'export-pagx' } }, '*');
    };

    refreshMotionAnchorButton.onclick = () => {
      clearError();
      refreshMotionAnchorButton.disabled = true;
      refreshMotionAnchorButton.textContent = '刷新中...';
      parent.postMessage({ pluginMessage: { type: 'refresh-motion-anchor' } }, '*');
    };

    cancelButton.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      exportButton.disabled = false;
      exportButton.textContent = '导出 PAGX';
      refreshMotionAnchorButton.disabled = false;
      refreshMotionAnchorButton.textContent = '刷新锚点缓存';

      if (msg.type === 'export-error') {
        showError(msg.error);
        return;
      }

      if (msg.type === 'export-result') {
        clearError();
        metaEl.style.display = 'block';
        metaEl.textContent = `画布 ${msg.width} × ${msg.height}，节点 ${msg.nodeCount} 个`;
        renderDiagnostics(msg.diagnostics);
        downloadPagx(msg.xml, msg.fileName);
        return;
      }

      if (msg.type === 'selection-motion-data') {
        renderMotionData(msg);
        return;
      }

      if (msg.type === 'refresh-motion-anchor-result') {
        showRefreshStatus(msg.message);
      }
    };
  </script>
</body>
</html>
